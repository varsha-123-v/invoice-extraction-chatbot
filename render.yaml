services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Service (Invoice Extraction & Key Manager)
  # -------------------------------------------------------------
  - type: web
    name: purchase-inventory-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DASHBOARD_PASSWORD
        sync: false
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_VISION_MODEL
        value: pixtral-12b-2409
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Streamlit Dashboard Frontend Service (Chatbot UI)
  # -------------------------------------------------------------
  - type: web
    name: purchase-inventory-dashboard
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        fromService:
          type: web
          name: purchase-inventory-backend
          property: host
